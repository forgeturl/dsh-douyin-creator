<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">抖音官方资料检索结果示例</title>
  <desc id="desc">使用插件真实索引数据展示推荐算法和内容质量检索结果，并将官方证据、推断和建议分层。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fc"/>
      <stop offset="1" stop-color="#e8f0f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#56718c" flood-opacity="0.18"/>
    </filter>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { fill: #4b6680; font-size: 15px; }
      .body { fill: #2f485f; font-size: 17px; }
      .small { fill: #60788f; font-size: 14px; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <g class="text">
    <rect x="36" y="28" width="1128" height="64" rx="16" fill="#0d2a48"/>
    <circle cx="68" cy="60" r="8" fill="#31d6c4"/>
    <text x="91" y="67" fill="#ffffff" font-size="23" font-weight="750">真实检索数据示例</text>
    <rect x="770" y="43" width="366" height="34" rx="17" fill="#173d62"/>
    <text x="790" y="66" fill="#d8e9f7" font-size="16">查询：推荐算法 内容质量</text>

    <text x="36" y="133" fill="#173b5c" font-size="20" font-weight="750">官方资料命中</text>
    <text x="714" y="133" fill="#173b5c" font-size="20" font-weight="750">回答如何分层</text>

    <g filter="url(#shadow)">
      <rect x="36" y="154" width="628" height="154" rx="18" fill="#ffffff"/>
      <rect x="36" y="326" width="628" height="154" rx="18" fill="#ffffff"/>
      <rect x="36" y="498" width="628" height="154" rx="18" fill="#ffffff"/>
      <rect x="714" y="154" width="450" height="498" rx="18" fill="#ffffff"/>
    </g>

    <rect x="56" y="174" width="88" height="27" rx="13.5" fill="#dff7f2"/>
    <text x="72" y="193" fill="#0e776e" font-size="14" font-weight="700">官方网页</text>
    <text x="56" y="232" fill="#173b5c" font-size="21" font-weight="750">平台治理为推荐算法设置“护栏”</text>
    <text x="56" y="263" class="body">推荐算法学习行为反馈并预测下一行为，平台治理负责干预缺陷。</text>
    <text x="56" y="289" class="small">ID 15384 · 抖音安全与信任中心 · 2025-01-20</text>

    <rect x="56" y="346" width="88" height="27" rx="13.5" fill="#e4efff"/>
    <text x="72" y="365" fill="#315f9f" font-size="14" font-weight="700">官方网页</text>
    <text x="56" y="404" fill="#173b5c" font-size="21" font-weight="750">适龄推荐算法优化</text>
    <text x="56" y="435" class="body">内容质量和治理资格会参与分发，不应把推荐简化成单一指标。</text>
    <text x="56" y="461" class="small">ID 8871785143945610 · 抖音安全与信任中心 · 2026-07-27</text>

    <rect x="56" y="518" width="88" height="27" rx="13.5" fill="#fff1da"/>
    <text x="72" y="537" fill="#9a6218" font-size="14" font-weight="700">视频转写</text>
    <text x="56" y="576" fill="#173b5c" font-size="21" font-weight="750">一个视频带你了解抖音的推荐算法</text>
    <text x="56" y="607" class="body">官方创作者课程介绍推荐系统如何根据多类信号选择内容。</text>
    <text x="56" y="633" class="small">ID 6761679510665465101 · 抖音作者助手 · 关键边界需回听</text>

    <rect x="738" y="178" width="402" height="88" rx="14" fill="#e5f8f4"/>
    <text x="758" y="207" fill="#0b756b" font-size="16" font-weight="750">1  官方公开</text>
    <text x="758" y="237" class="body">推荐学习用户行为，但官方没有公布固定权重。</text>

    <rect x="738" y="282" width="402" height="88" rx="14" fill="#eaf1ff"/>
    <text x="758" y="311" fill="#315f9f" font-size="16" font-weight="750">2  合理推断</text>
    <text x="758" y="341" class="body">只优化完播率，可能忽略内容价值与负反馈。</text>

    <rect x="738" y="386" width="402" height="104" rx="14" fill="#fff4df"/>
    <text x="758" y="415" fill="#966019" font-size="16" font-weight="750">3  运营建议</text>
    <text x="758" y="445" class="body">用同题材、相近时长作品做单变量测试，</text>
    <text x="758" y="473" class="body">同时观察观看、互动质量和负反馈。</text>

    <rect x="738" y="506" width="402" height="122" rx="14" fill="#f2ebff"/>
    <text x="758" y="535" fill="#6741a5" font-size="16" font-weight="750">4  账号结论</text>
    <text x="758" y="565" class="body">只有用户提供作品数据后才能形成，</text>
    <text x="758" y="593" class="body">并注明样本、时间窗、口径和不确定性。</text>

    <rect x="36" y="683" width="1128" height="47" rx="13" fill="#dce8f3"/>
    <text x="56" y="713" class="label">展示内容来自插件真实索引；这是结果说明图，不冒充当前 DSH Web UI 截图。涉及现行规则时仍需核对最新官方来源。</text>
  </g>
</svg>

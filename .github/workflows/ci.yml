name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 22.19.0
          - 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test
        run: npm test

      - name: Inspect package
        run: npm run pack:check

  installer-syntax:
    timeout-minutes: 20
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse macOS installer
        if: runner.os == 'macOS'
        run: bash -n 'installers/macos/安装并启动.command' 'macOS-双击安装并启动.command'

      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'installers/windows/install.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Cold-start Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}\dsh-home
          DSH_CREATOR_RUNTIME_ROOT: ${{ runner.temp }}\dsh-runtime
          DSH_SKIP_LAUNCH: '1'
          DSH_NONINTERACTIVE: '1'
          DSH_NPM_REGISTRY: https://registry.npmmirror.com
        run: |
          $WindowsPowerShell = (Get-Command powershell.exe).Source
          $InstallerScript = (Resolve-Path 'installers/windows/install.ps1').Path
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          & $WindowsPowerShell -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File $InstallerScript
          $InstallerExitCode = $LASTEXITCODE
          if ($InstallerExitCode -ne 0) {
            $InstallLog = Join-Path $env:DSH_CREATOR_RUNTIME_ROOT 'install.log'
            if (Test-Path $InstallLog) {
              Write-Host '=== Windows installer log tail ==='
              $InstallLogTail = Get-Content $InstallLog -Tail 120
              $InstallLogTail
              $Annotation = ($InstallLogTail -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Windows installer log::$Annotation"
            }
            else {
              Write-Host '::error title=Windows installer log::install.log was not created'
            }
            exit $InstallerExitCode
          }

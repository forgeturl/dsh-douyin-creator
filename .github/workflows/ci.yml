name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 22.19.0
          - 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test
        run: npm test

      - name: Inspect package
        run: npm run pack:check

  installer-syntax:
    timeout-minutes: 20
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse macOS installer
        if: runner.os == 'macOS'
        run: bash -n 'installers/macos/安装并启动.command' 'macOS-双击安装并启动.command'

      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $WindowsPowerShell = (Get-Command powershell.exe).Source
          $InstallerScript = (Resolve-Path 'installers/windows/install.ps1').Path
          $EscapedInstallerScript = $InstallerScript.Replace("'", "''")
          $ParserCommand = @"
          `$tokens = `$null
          `$errors = `$null
          [System.Management.Automation.Language.Parser]::ParseFile('$EscapedInstallerScript', [ref]`$tokens, [ref]`$errors) | Out-Null
          if (`$errors.Count -gt 0) { exit 1 }
          "@
          & $WindowsPowerShell -NoLogo -NoProfile -Command $ParserCommand
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cold-start Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}\dsh-home
          DSH_CREATOR_RUNTIME_ROOT: ${{ runner.temp }}\dsh-runtime
          DSH_SKIP_LAUNCH: '1'
          DSH_NONINTERACTIVE: '1'
          DSH_NPM_REGISTRY: https://registry.npmmirror.com
          DSH_INSTALL_STATUS_FILE: ${{ runner.temp }}\dsh-install-status.txt
        run: |
          $WindowsPowerShell = (Get-Command powershell.exe).Source
          $InstallerScript = (Resolve-Path 'installers/windows/install.ps1').Path
          Set-Content -LiteralPath $env:DSH_INSTALL_STATUS_FILE -Value 'wrapper-ready' -Encoding Ascii
          $EscapedInstallerScript = $InstallerScript.Replace("'", "''")
          $InstallerCommand = "& '$EscapedInstallerScript'"
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          & $WindowsPowerShell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command $InstallerCommand
          $InstallerExitCode = $LASTEXITCODE
          if ($InstallerExitCode -ne 0) {
            $InstallerPhase = if (Test-Path $env:DSH_INSTALL_STATUS_FILE) {
              (Get-Content $env:DSH_INSTALL_STATUS_FILE -Raw).Trim()
            } else { 'not-started' }
            if ($InstallerPhase -notmatch '^[a-z0-9-]+$') { $InstallerPhase = 'invalid-status' }
            Write-Host "::error title=Windows installer phase::Stopped after phase: $InstallerPhase"
            exit $InstallerExitCode
          }

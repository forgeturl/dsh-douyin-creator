name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 22.19.0
          - 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test
        run: npm test

      - name: Inspect package
        run: npm run pack:check

  installer-syntax:
    timeout-minutes: 20
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse macOS installer
        if: runner.os == 'macOS'
        run: bash -n 'installers/macos/安装并启动.command' 'macOS-双击安装并启动.command'

      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'installers/windows/install.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Cold-start Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}\dsh-home
          DSH_CREATOR_RUNTIME_ROOT: ${{ runner.temp }}\dsh-runtime
          DSH_SKIP_LAUNCH: '1'
          DSH_NONINTERACTIVE: '1'
          DSH_NPM_REGISTRY: https://registry.npmmirror.com
        run: |
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          & (Resolve-Path 'installers/windows/install.ps1')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
